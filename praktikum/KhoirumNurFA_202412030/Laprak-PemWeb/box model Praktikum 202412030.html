<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Box Model CSS</title>
    <style>
        .kotak-kustom {
            /* Mengubah ukuran lebar kotak menjadi 300px */
            width: 300px;

            /* Mengatur ketebalan dan warna border (merah tebal) */
            border: 5px solid rgb(144, 60, 60);

            /* Mengatur padding (jarak antara teks ke border dalam) sebesar 15px */
            padding: 15px;

            /* Mengatur margin (jarak di luar border kotak) sebesar 30px */
            margin: 30px;

            /* Properti tambahan kosmetik agar tampilan kotak lebih menarik */
            background-color: #ffe6e6;
            font-family: Arial, sans-serif;
            color: #333333;
        }
    </style>
</head>
<body>

    <div class="kotak-kustom">
        Khoirum Nurfatikha A  Nim 202412030 kelas Sore Informatikaa.
    </div>

</body>
</html>
