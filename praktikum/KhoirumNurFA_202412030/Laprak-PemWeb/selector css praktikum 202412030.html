<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Selektor Class dan ID</title>
    <style>
        /* Mengatur latar belakang berbeda menggunakan selektor Class (.) */
        .bg-biru {
            background-color: lightblue;
            padding: 10px;
            margin-bottom: 10px;
        }

        .bg-hijau {
            background-color: rgb(239, 186, 220);
            padding: 10px;
            margin-bottom: 10px;
        }

        .bg-kuning {
            background-color: rgb(227, 178, 231);
            padding: 10px;
            margin-bottom: 10px;
        }

        /* Mengubah ukuran font menggunakan selektor ID (#) */
        #teks-besar {
            font-size: 28px;
            font-weight: bold;
            color: #333333;
        }
    </style>
</head>
<body>

    <h1 id="teks-besar">Ini adalah Judul Besar (Menggunakan ID)</h1>

    <p class="bg-biru">Paragraf pertama ini menggunakan latar belakang berwarna biru muda.</p>
    
    <p class="bg-hijau">Paragraf kedua ini menggunakan latar belakang berwarna hijau muda.</p>
    
    <p class="bg-kuning">Paragraf ketiga ini menggunakan latar belakang berwarna kuning muda.</p>

</body>
</html>
