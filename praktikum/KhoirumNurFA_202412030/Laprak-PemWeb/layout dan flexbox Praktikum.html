<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan CSS Flexbox</title>
    <style>
        /* Mengatur wadah utama (container) */
        .container {
            /* Mengaktifkan mode Flexbox */
            display: flex;
            
            /* Mengatur agar item tersebar merata di sepanjang sumbu utama (horizontal) */
            justify-content: space-around;
            
            /* Mengatur agar item sejajar di tengah secara vertikal */
            align-items: center;

            /* Properti tambahan pembantu untuk melihat hasil sejajar tengah */
            height: 200px; /* Memberikan tinggi wadah agar posisi vertikal terlihat */
            background-color: #f0f0f0; /* Warna latar belakang wadah */
            border: 2px dashed #999;
        }

        /* Mengatur tampilan kotak item di dalamnya */
        .item {
            background-color: lightcoral;
            color: white;
            padding: 20px;
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 18px;
            text-align: center;
            border-radius: 8px;
            min-width: 80px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="item">Item 1</div>
        <div class="item">Item 2</div>
        <div class="item">Item 3</div>
    </div>

</body>
</html>
