<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Tipografi CSS</title>
    <style>
        h1 {
            /* Mengubah jenis font menjadi Georgia (serif) */
            font-family: 'Georgia', 'Times New Roman', serif;
            
            /* Mengubah ukuran font menjadi besar */
            font-size: 42px;
            
            /* Mengatur ketebalan font */
            font-weight: bold;
            
            /* Mengatur warna teks judul */
            color: #c48bcf;
        }

        p {
            /* Mengubah jenis font paragraf agar kontras dengan judul */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 18px;
            
            /* Mengatur teks menjadi rata kanan (right align) */
            text-align: right;
            
            /* Memberikan efek garis bawah pada teks */
            text-decoration: underline;
            
            /* Mengatur warna teks paragraf */
            color: #dfaed2;
        }
    </style>
</head>
<body>

    <h1>Ini jualan TIKAAA </h1>
    
    <p>Ini menu menu jualan tika yang lejat yummy enakk tauuuuuuu dijamin menjamin hahahahha.</p>

</body>
</html>
