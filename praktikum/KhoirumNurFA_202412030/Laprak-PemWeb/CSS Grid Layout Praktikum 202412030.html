<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan CSS Grid Avanzado</title>
    <style>
        /* Mengatur wadah utama (Grid Container) */
        .grid-container {
            display: grid;
            
            /* Membuat 3 kolom dengan lebar yang sama besar (1 bagian per kolom) */
            grid-template-columns: repeat(3, 1fr);
            
            /* Membuat 2 baris dengan tinggi masing-masing 100px */
            grid-template-rows: repeat(2, 100px);
            
            /* Mengatur jarak (gap) antar grid item sebesar 15px */
            gap: 15px;
            
            background-color: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
        }

        /* Mengatur properti umum untuk semua Grid Item */
        .grid-item {
            color: white;
            display: flex;
            justify-content: center; /* Teks di tengah secara horizontal */
            align-items: center;    /* Teks di tengah secara vertikal */
            font-family: Arial, sans-serif;
            font-weight: bold;
            font-size: 20px;
            border-radius: 4px;
        }

        /* Mengatur warna latar belakang yang berbeda untuk tiap-tiap item */
        .item-1 { 
            background-color: #E74C3C; /* Merah */
            
            /* Mengatur agar Item 1 menempati 2 kolom sekaligus */
            /* Dimulai dari garis kolom 1 dan selesai di garis kolom 3 */
            grid-column: 1 / 3; 
        }
        
        .item-2 { background-color: #3498DB; } /* Biru */
        .item-3 { background-color: #2ECC71; } /* Hijau */
        .item-4 { background-color: #F1C40F; } /* Kuning */
        .item-5 { background-color: #9B59B6; } /* Ungu */
        .item-6 { background-color: #E67E22; } /* Jingga */
    </style>
</head>
<body>

    <div class="grid-container">
        <div class="grid-item item-1">Item 1 (2 Kolom)</div>
        <div class="grid-item item-2">Item 2</div>
        <div class="grid-item item-3">Item 3</div>
        <div class="grid-item item-4">Item 4</div>
        <div class="grid-item item-5">Item 5</div>
        <div class="grid-item item-6">Item 6</div>
    </div>

</body>
</html>
